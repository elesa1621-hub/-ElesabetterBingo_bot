<!doctype html><html lang="am"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrustBINGO Admin</title><style>body{font-family:Arial;background:#101827;color:white;display:grid;place-items:center;min-height:90vh}.box{background:#1d2b42;padding:28px;border-radius:14px;width:min(360px,85vw)}input,button{padding:12px;width:100%;box-sizing:border-box;margin:8px 0;border-radius:8px;border:0}button{background:#63d6c5;font-weight:bold}</style>
<div class="box"><h2>🔐 የአስተዳዳሪ መግቢያ</h2>{% with messages=get_flashed_messages() %}{% for m in messages %}<p>{{m}}</p>{% endfor %}{% endwith %}
<form method="post"><input type="password" name="password" placeholder="የይለፍ ቃል" required><button>ግባ</button></form><a href="/">ወደ ዋና ገጽ</a></div></html>
